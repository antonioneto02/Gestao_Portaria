services:
  erp-cini:
    image: erp-cini:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-cini
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      # No Docker o ProtheusAuth e outro container; no PM2 vale o padrao localhost do codigo
      PROTHEUS_AUTH_INTERNAL_URL: https://protheus-auth:3032
      CERT_DIR: C:/certs
    volumes:
      - ./uploads:C:/app/uploads
      - C:/Projetos/Certificados:C:/certs:ro
